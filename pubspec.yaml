name: sentinel_v2
description: "Sentinel: seguridad y viajes grupales para motociclistas."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^18.0.0
  google_maps_flutter: ^2.18.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  maplibre_gl: ^0.27.0
  permission_handler: ^13.0.1
  riverpod_annotation: ^4.0.6
  sensors_plus: ^7.1.0
  supabase_flutter: ^2.17.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true

# permission_handler_android 14.0.0 hardcodes `compileSdk = 37`, but the
# freshly-released Android SDK Platform 37 installs under the fractional
# target hash "android-37.0" (not "android-37"), so Gradle can't resolve it
# yet on a clean toolchain — see README's troubleshooting note. Pinning to
# 13.0.1 (compileSdk 35) keeps the Android build green until that plugin
# release catches up; nothing else in the app depends on 14.0.0's new APIs.
dependency_overrides:
  permission_handler_android: 13.0.1

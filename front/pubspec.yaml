name: sentinel_v2
description: "Sentinel: seguridad y viajes grupales para motociclistas."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^22.3.0
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.2
  # SDK package (no pub version) — only `usePathUrlStrategy()` in
  # `bootstrap.dart`, so the public share link is a plain path
  # (`/share/<token>`) instead of a `#/share/<token>` fragment, which is
  # what lets Android App Links match it at all (an intent-filter's
  # <data> path matching never sees the URL fragment). No-op outside Web.
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^18.0.0
  http: ^1.5.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  permission_handler: ^13.0.1
  riverpod_annotation: ^4.0.6
  sensors_plus: ^7.1.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  uuid: ^4.6.0
  web_socket_channel: ^3.0.2

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
  assets:
    - .env

# permission_handler_android 14.0.0 hardcodes `compileSdk = 37`, but the
# freshly-released Android SDK Platform 37 installs under the fractional
# target hash "android-37.0" (not "android-37"), so Gradle can't resolve it
# yet on a clean toolchain — see README's troubleshooting note. Pinning to
# 13.0.1 (compileSdk 35) keeps the Android build green until that plugin
# release catches up; nothing else in the app depends on 14.0.0's new APIs.
dependency_overrides:
  permission_handler_android: 13.0.1

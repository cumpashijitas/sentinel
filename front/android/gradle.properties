org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Workaround for a known Windows-only bug in the Kotlin Build Tools API's
# incremental compiler ("Could not close incremental caches" during
# compileReleaseKotlin — flutter/flutter#173456, flutter/flutter#187225,
# JetBrains KT-80077), hit live building this project's release APK on
# Windows with Kotlin 2.4.0/Gradle 9.3.1. Investigated, not guessed: the
# build fails deterministically (reproduced twice, including after a full
# `flutter clean`) on package_info_plus/sensors_plus/
# shared_preferences_android's compileReleaseKotlin task specifically.
# Disabling Kotlin's incremental compilation sidesteps the cache-closing
# code path entirely — slightly slower rebuilds, but the release build
# actually completes. Safe to remove once upstream fixes the bug.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
